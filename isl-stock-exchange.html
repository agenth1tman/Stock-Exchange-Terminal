<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSX Terminal</title>
  <link rel="icon" type="image/png" href="https://www.google.com/s2/favicons?domain=isl.school&sz=256">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #080808;
      --gold: #f0c000;
      --gold-hover: #ffd700;
      --blue-dark: #1a3a8f;
      --text-main: #f5f0e8;
      --text-muted: #555566;
      --panel: rgba(14, 14, 14, 0.9);
      --border-subtle: rgba(240, 192, 0, 0.12);
      --profit: #4caf7d;
      --loss: #cc2233;
    }

    body {
      margin: 0;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    /* Background Grid Setup */
    .grid-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(240, 192, 0, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(240, 192, 0, 0.05) 1px, transparent 1px);
      background-size: 64px 64px;
      z-index: 0;
    }

    .grid-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 20%, var(--bg-dark) 80%);
    }

    /* Custom UI Elements */
    .glass-panel {
      background: var(--panel);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
    }

    .tx-input {
      width: 100%;
      background: rgba(14, 14, 14, 0.9);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 13px;
      padding: 12px 16px;
      outline: none;
      font-family: inherit;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    .tx-input:focus {
      border-color: rgba(240, 192, 0, 0.5);
      box-shadow: 0 0 0 1px rgba(240, 192, 0, 0.15);
    }

    .tx-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .btn-gold {
      width: 100%;
      background: var(--gold);
      color: black;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-gold:hover {
      background: var(--gold-hover);
    }

    .btn-gold:active {
      transform: scale(0.99);
    }

    /* Floating Connection Panel (No Drag, Auto-Fade) */
    #floating-panel {
      position: absolute;
      width: 256px;
      z-index: 20;
      box-shadow: 0 0 0 1px rgba(240, 192, 0, 0.05), 0 24px 64px rgba(0, 0, 0, 0.8);
      top: 100px;
      left: 48px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      opacity: 1;
      visibility: visible;
    }

    /* When this class is added, the panel fades out */
    #floating-panel.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .drag-handle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(240, 192, 0, 0.1);
      background: #0a0a0a;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .spin {
      animation: spin 1s linear infinite;
    }

    /* --- TEAM DASHBOARD FIGMA STYLES --- */
    .tp-card {
      flex: 1;
      border: 1px solid rgba(240, 192, 0, 0.12);
      background: #0e0e0e;
      padding: 16px 20px;
    }

    .tp-label {
      font-size: 9px;
      color: #555566;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tp-val {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #f5f0e8;
    }

    .tp-table-wrap {
      border: 1px solid rgba(240, 192, 0, 0.12);
      background: #0e0e0e;
      margin-bottom: 24px;
    }

    .tp-table-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
    }

    .tp-table {
      width: 100%;
      border-collapse: collapse;
    }

    .tp-table th {
      padding: 10px 20px;
      font-size: 9px;
      color: #555566;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 600;
      text-align: right;
      border-bottom: 1px solid rgba(240, 192, 0, 0.06);
    }

    .tp-table th:first-child {
      text-align: left;
    }

    .tp-table td {
      padding: 14px 20px;
      text-align: right;
      border-bottom: 1px solid rgba(240, 192, 0, 0.04);
    }

    .tp-table td:first-child {
      text-align: left;
    }

    .tp-tab {
      padding: 12px 24px;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      color: #555566;
      transition: all 0.2s;
      font-family: inherit;
      margin-bottom: -1px;
    }

    .tp-tab:hover {
      color: #888888;
    }

    .tp-tab.active {
      color: #f0c000;
      border-bottom-color: #f0c000;
    }

    .tp-btn {
      flex: 1;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.1s;
      border: none;
      font-family: inherit;
    }

    .tp-btn:active {
      transform: scale(0.98);
    }

    .tp-btn-buy {
      background: #f0c000;
      color: black;
    }

    .tp-btn-buy:hover {
      background: #ffd700;
    }

    .tp-btn-sell {
      border: 1px solid #1a3a8f;
      background: rgba(26, 58, 143, 0.1);
      color: #7aaaff;
    }

    .tp-btn-sell:hover {
      background: rgba(204, 34, 51, 0.2);
      border-color: rgba(204, 34, 51, 0.6);
      color: #cc2233;
    }

    /* --- HEADER & TICKER FIGMA STYLES --- */
    .tp-header-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(240, 192, 0, 0.15);
      background: transparent;
      padding: 6px 16px;
      color: #555566;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-weight: 600;
    }

    .tp-header-btn:hover {
      border-color: rgba(204, 34, 51, 0.5);
      color: #cc2233;
    }

    .tp-live-badge {
      border: 1px solid rgba(76, 175, 125, 0.3);
      color: #4caf7d;
      cursor: default;
    }

    .tp-ticker-wrap {
      width: 100%;
      overflow: hidden;
      background: rgba(8, 8, 8, 0.8);
      border-bottom: 1px solid rgba(240, 192, 0, 0.1);
      padding: 8px 0;
      display: flex;
    }

    .tp-ticker-track {
      display: flex;
      width: max-content;
      animation: ticker-scroll 120s linear infinite;
    }

    @keyframes ticker-scroll {
      0% {
        transform: translate3d(0, 0, 0);
      }

      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }

    .tp-ticker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 32px;
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    /* --- AGGRESSIVE MARKET STATE ANIMATIONS --- */
    .market-banner-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .market-banner {
      width: 150vw;
      height: 160px;
      transform: translateX(-150%) skewX(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
      border-top: 6px solid rgba(255, 255, 255, 0.8);
      border-bottom: 6px solid rgba(255, 255, 255, 0.8);
    }

    .market-banner.animate-in {
      animation: banner-slide 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes banner-slide {
      0% {
        transform: translateX(-150%) skewX(-45deg);
      }

      15% {
        transform: translateX(0) skewX(-45deg);
      }

      85% {
        transform: translateX(0) skewX(-45deg);
      }

      100% {
        transform: translateX(150%) skewX(-45deg);
      }
    }

    .market-content {
      transform: skewX(45deg);
      /* Un-skew the text so it is readable */
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .market-text {
      font-size: 84px;
      font-weight: 900;
      color: black;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1;
    }

    /* Lock Physics */
    @keyframes lock-open {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(-8px);
      }
    }

    @keyframes lock-close {
      0% {
        transform: translateY(-8px);
      }

      100% {
        transform: translateY(0);
      }
    }

    .shackle-open {
      animation: lock-open 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      animation-delay: 0.8s;
    }

    .shackle-close {
      animation: lock-close 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      animation-delay: 0.8s;
    }

    /* --- ADMIN PANEL FIGMA ANIMATIONS --- */
    @keyframes ring-rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .ring-rotate {
      animation: ring-rotate 8s linear infinite;
      transform-origin: center;
    }

    .ring-rotate-rev {
      animation: ring-rotate 12s linear infinite reverse;
      transform-origin: center;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.88);
        opacity: 0.7;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .pulse-ring {
      animation: pulse-ring 2s ease-out infinite;
      transform-origin: center;
    }

    @keyframes red-breathe {

      0%,
      100% {
        box-shadow: 0 0 12px 2px rgba(204, 34, 51, 0.15), inset 0 0 30px rgba(204, 34, 51, 0.05);
      }

      50% {
        box-shadow: 0 0 32px 8px rgba(204, 34, 51, 0.35), inset 0 0 60px rgba(204, 34, 51, 0.1);
      }
    }

    .red-breathe {
      animation: red-breathe 2.4s ease-in-out infinite;
    }

    @keyframes gold-glow {

      0%,
      100% {
        box-shadow: 0 0 16px 3px rgba(240, 192, 0, 0.12), inset 0 0 40px rgba(240, 192, 0, 0.04);
      }

      50% {
        box-shadow: 0 0 36px 8px rgba(240, 192, 0, 0.25), inset 0 0 60px rgba(240, 192, 0, 0.08);
      }
    }

    .gold-glow {
      animation: gold-glow 3s ease-in-out infinite;
    }

    @keyframes radar {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .radar-sweep {
      animation: radar 3s linear infinite;
      transform-origin: center;
    }

    .market-btn {
      cursor: pointer;
      transition: transform 0.15s ease;
      border: none;
      outline: none;
    }

    .market-btn:active {
      transform: scale(0.96) !important;
    }

    /* Custom Admin Scrollbar */
    .admin-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .admin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .admin-scroll::-webkit-scrollbar-thumb {
      background: rgba(240, 192, 0, 0.2);
      border-radius: 4px;
    }

    /* --- ADMIN BUTTON HOVER STATES --- */
    .admin-btn-blue {
      background: rgba(26, 58, 143, 0.1);
      border: 1px solid #1a3a8f;
      color: #7aaaff;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .admin-btn-blue:hover {
      background: rgba(26, 58, 143, 0.3);
    }

    .admin-btn-red {
      background: transparent;
      border: 1px solid rgba(240, 192, 0, 0.1);
      color: #444455;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-btn-red:hover {
      border-color: rgba(204, 34, 51, 0.4);
      color: #cc2233;
    }

    .admin-btn-gold {
      background: #f0c000;
      color: black;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .admin-btn-gold:hover {
      background: #ffd700;
    }

    .admin-btn-apply {
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.2em;
      color: #f0c000;
      background: transparent;
      border: 1px solid rgba(240, 192, 0, 0.3);
      padding: 6px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .admin-btn-apply:hover {
      background: #f0c000;
      color: black;
      border-color: #f0c000;
    }

    .admin-btn-remove {
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.2em;
      color: #cc2233;
      background: transparent;
      border: 1px solid rgba(204, 34, 51, 0.3);
      padding: 6px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .admin-btn-remove:hover {
      background: #cc2233;
      color: white;
      border-color: #cc2233;
    }

    .admin-btn-addcash {
      background: transparent;
      border: 1px solid rgba(76, 175, 125, 0.5);
      color: #4caf7d;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .admin-btn-addcash:hover {
      background: #4caf7d;
      color: black;
      border-color: #4caf7d;
    }

    .admin-btn-subcash {
      background: transparent;
      border: 1px solid rgba(204, 34, 51, 0.5);
      color: #cc2233;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .admin-btn-subcash:hover {
      background: #cc2233;
      color: white;
      border-color: #cc2233;
    }

    .market-btn:hover {
      transform: scale(1.03);
    }

    /* --- EYE ICON STATES --- */
    .tx-eye-btn {
      color: #555566 !important;
      transition: color 0.1s ease;
    }

    .tx-eye-btn:hover {
      color: #aaaaaa !important;
    }

    .tx-eye-btn.is-visible {
      color: #f0c000 !important;
    }

    .tx-eye-btn.is-visible:hover {
      color: #ffd700 !important;
    }

    /* --- EASTER EGG MODAL --- */
    .ee-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 8, 8, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ee-fade-in 0.3s ease-out forwards;
    }

    .ee-modal {
      width: 440px;
      background: #080808;
      border: 1px solid rgba(240, 192, 0, 0.3);
      box-shadow: 0 0 60px rgba(240, 192, 0, 0.1);
      padding: 2px;
      position: relative;
      overflow: hidden;
      transform: scale(0.95);
      animation: ee-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .ee-inner {
      background: #0e0e0e;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(240, 192, 0, 0.1);
    }

    .ee-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.4em;
      color: #f0c000;
      text-transform: uppercase;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .ee-line {
      width: 40px;
      height: 1px;
      background: rgba(240, 192, 0, 0.5);
    }

    .ee-name {
      font-size: 20px;
      font-weight: 900;
      color: #f5f0e8;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .ee-role {
      font-size: 10px;
      color: #8899bb;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .ee-subtext {
      color: #555566;
      font-size: 9px;
    }

    .ee-btn {
      margin-top: 16px;
      width: 100%;
      background: transparent;
      border: 1px solid #f0c000;
      color: #f0c000;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .ee-btn:hover {
      background: #f0c000;
      color: black;
      box-shadow: 0 0 20px rgba(240, 192, 0, 0.4);
    }

    @keyframes ee-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes ee-pop {
      to {
        transform: scale(1);
      }
    }

    /* --- RUNTIME STATES --- */
    button:disabled {
      cursor: not-allowed !important;
      opacity: 0.45;
    }

    button:disabled:active,
    .market-btn:disabled:hover {
      transform: none !important;
    }

    .sys-version:hover {
      color: #f0c000 !important;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(76, 175, 125, 0.3);
      padding: 6px 16px;
      color: #4caf7d;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .live-badge:hover {
      background: rgba(76, 175, 125, 0.1);
    }

    .live-badge.is-offline {
      border-color: rgba(240, 192, 0, 0.3);
      color: #f0c000;
    }

    .live-badge.is-offline:hover {
      background: rgba(240, 192, 0, 0.08);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    #conn-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99990;
      padding: 8px 16px;
      background: #f0c000;
      color: black;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-align: center;
      text-transform: uppercase;
    }

    #conn-banner.show {
      display: block;
    }

    #toast-stack {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 99995;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      max-width: min(420px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast {
      background: #0e0e0e;
      border: 1px solid;
      padding: 12px 16px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      line-height: 1.5;
      text-transform: uppercase;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      animation: ee-fade-in 0.2s ease-out;
      transition: opacity 0.25s ease;
    }

    .toast-ok {
      color: #4caf7d;
      border-color: rgba(76, 175, 125, 0.4);
    }

    .toast-err {
      color: #cc2233;
      border-color: rgba(204, 34, 51, 0.45);
    }

    .toast-out {
      opacity: 0;
    }

    .tbl-scroll {
      width: 100%;
      overflow-x: auto;
    }

    /* --- NARROW SCREENS (phones / small tablets) --- */
    @media (max-width: 860px) {
      .hdr {
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px 16px !important;
      }

      .hdr-sub {
        display: none;
      }

      .hdr-center {
        position: static !important;
        transform: none !important;
        order: 3;
        width: 100%;
      }

      .tab-row {
        padding: 0 8px !important;
        overflow-x: auto;
      }

      .tab-row .tp-tab {
        padding: 12px 14px !important;
        flex-shrink: 0;
      }

      .view-body {
        padding: 16px !important;
      }

      .td-wrap {
        padding: 0 !important;
      }

      .resp-stack {
        flex-direction: column !important;
      }

      .resp-full {
        width: 100% !important;
      }

      .resp-wrap {
        flex-wrap: wrap;
      }

      .resp-wrap>* {
        flex: 1 1 calc(50% - 16px) !important;
        min-width: 140px;
      }

      .resp-minh {
        min-height: 320px;
      }

      .tp-table th,

</head>

<body>

      <div id="screen-login"

      <!-- SCREEN 1: TEAM DASHBOARD (Edge-to-Edge) -->

      <!-- SCREEN 2: ADMIN CONSOLE -->

    </main>
  </div>

  <script>
    (function () {
      "use strict";

      // The server decides everything: who is logged in, prices, cash, holdings.
      // This page only shows what the server sends and asks it to do things.

      var URL_KEY = "msx-ws-url";
      var TOKEN_KEY = "msx-session";
      var FALLBACK_URL = "wss://taurusmatrix.bid/ws";
      var PING_EVERY = 20000;
      var PONG_TIMEOUT = 10000;
      var REQUEST_TIMEOUT = 15000;

      // --- HELPERS ---
      function $(id) { return document.getElementById(id); }
      function fmt(n) { return Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 }); }
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function pctChange(c) { return c.prevPrice ? ((c.price - c.prevPrice) / c.prevPrice) * 100 : 0; }
      function gainText(n) { return (n >= 0 ? "+" : "&minus;") + "$" + fmt(Math.abs(n)); }
      function fieldValue(id) { var el = $(id); return el ? el.value : ""; }
      function clearFields(ids) { ids.forEach(function (id) { var el = $(id); if (el) el.value = ""; }); }
      function readStore(area, key) { try { return window[area].getItem(key); } catch (e) { return null; } }
      function writeStore(area, key, value) {
        try { if (value == null) window[area].removeItem(key); else window[area].setItem(key, value); } catch (e) { }
      }
      function findTeam(username) {
        return gameState && gameState.teams ? gameState.teams.find(function (t) { return t.username === username; }) : null;
      }
      function findCompany(id) {
        return gameState ? gameState.companies.find(function (c) { return c.id === id; }) : null;
      }

      var EYE_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      var EYE_OFF_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line></svg>';
      var STATUS_ICONS = {
        offline: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"></line><path d="M8.5 8.5a10 10 0 0 1 11 0"></path><path d="M12.5 12.5a5 5 0 0 1 3 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>',
        connecting: '<svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f0c000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="4.93" x2="19.07" y2="7.76"></line></svg>',
        connected: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4caf7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>',
        error: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cc2233" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"></line><path d="M8.5 8.5a10 10 0 0 1 11 0"></path><path d="M12.5 12.5a5 5 0 0 1 3 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>'
      };

      // --- APP STATE ---
      var ws = null;
      var activeUrl = "";
      var connState = "offline";
      var candidates = [];
      var candidateIdx = 0;
      var reconnectTimer = null;
      var reconnectDelay = 500;
      var pingTimer = null;
      var pongTimer = null;
      var helloTimer = null;

      var role = null;         // only ever set by the server's "auth" message
      var gameState = null;     // the latest state the server sent for this role
      var stateVersion = 0;
      var lastMarketState = null;
      var pending = {};
      var reqSeq = 0;
      var loginBusy = false;
      var local = freshLocal();

      function freshLocal() {
        return { adminTab: "overview", teamTab: "dashboard", selectedCompanyId: null, revealed: {}, tradeBusy: false };
      }

      // --- CONNECTION STATUS STRIP ---
      function setConn(state) {
        connState = state;
        var iconDiv = $("status-icon"), textDiv = $("status-text"), subTextDiv = $("status-subtext");
        var address = activeUrl || "server";
        if (iconDiv && textDiv && subTextDiv) {
          iconDiv.innerHTML = STATUS_ICONS[state] || STATUS_ICONS.offline;
          if (state === "connecting") {
            textDiv.textContent = "CONNECTING";
            textDiv.style.color = "var(--gold)";
            subTextDiv.textContent = "Reaching " + address + "...";
          } else if (state === "connected") {
            textDiv.textContent = "LIVE";
            textDiv.style.color = "var(--profit)";
            subTextDiv.textContent = "Stream active · " + address;
          } else if (state === "error") {
            textDiv.textContent = "FAILED";
            textDiv.style.color = "var(--loss)";
            subTextDiv.textContent = "Cannot reach " + address + " · retrying";
          } else {
            textDiv.textContent = "OFFLINE";
            textDiv.style.color = "var(--text-muted)";
            subTextDiv.textContent = "No data source connected";
          }
        }
        var panel = $("floating-panel");
        if (panel) panel.classList.toggle("hidden", state === "connected");
        render();
      }

      // --- WEBSOCKET PIPELINE ---
      function isLocalHost(host) {
        return host === "localhost" || host === "[::1]" || /^\d{1,3}(\.\d{1,3}){3}$/.test(host) || /\.local$/.test(host);
      }

      function defaultSocketUrl() {
        var loc = window.location;
        if (loc.protocol !== "http:" && loc.protocol !== "https:") return FALLBACK_URL;
        return (loc.protocol === "https:" ? "wss://" : "ws://") + loc.host + "/ws";
      }

      // Addresses to try on page load, best guess first.
      function startupCandidates() {
        var loc = window.location;
        var saved = readStore("localStorage", URL_KEY);
        if (loc.protocol !== "http:" && loc.protocol !== "https:") return [saved, FALLBACK_URL];
        var list = [defaultSocketUrl(), saved];
        // Page opened from a local dev server (e.g. Live Server): the game server is usually on :8000.
        if (loc.protocol === "http:" && isLocalHost(loc.hostname) && loc.port !== "8000") {
          list.push("ws://" + loc.hostname + ":8000/ws");
        }
        return list;
      }

      function isLive() {
        return !!ws && ws.readyState === WebSocket.OPEN && connState === "connected";
      }

      function normalizeSocketUrl(raw) {
        var value = raw.trim();
        var scheme = "";
        var m = value.match(/^([a-z]+):\/\//i);
        if (m) { scheme = m[1].toLowerCase(); value = value.slice(m[0].length); }
        var host = value.split(/[\/?#]/)[0].replace(/:\d+$/, "").toLowerCase();
        var local = isLocalHost(host);
        var proto;
        if (scheme === "ws" || scheme === "http") proto = "ws://";
        else if (scheme === "wss" || scheme === "https") proto = "wss://";
        else if (scheme) throw new Error("Unsupported address");
        else proto = local && window.location.protocol !== "https:" ? "ws://" : "wss://";
        var url = new URL(proto + value);
        if (local && !url.port) url.port = "8000";
        if (url.pathname === "/" || url.pathname === "") url.pathname = "/ws";
        return url.href;
      }

      function startConnecting(urls) {
        candidates = urls.filter(function (u, i) { return u && urls.indexOf(u) === i; });
        candidateIdx = 0;
        reconnectDelay = 500;
        openSocket();
      }

      function openSocket() {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        dropSocket();
        if (!candidates.length) return;
        activeUrl = candidates[candidateIdx];
        setConn("connecting");
        var sock;
        try {
          sock = new WebSocket(activeUrl);
        } catch (e) {
          onSocketFailed(false);
          return;
        }
        ws = sock;
        sock.onopen = function () {
          if (ws !== sock) return;
          // Only trust the socket once our own server greets us (some other
          // dev server could also be listening on /ws).
          clearTimeout(helloTimer);
          helloTimer = setTimeout(function () { if (ws === sock) onSocketFailed(false); }, 6000);
        };
        sock.onmessage = function (event) { if (ws === sock) onServerMessage(event.data); };
        sock.onclose = function () { if (ws === sock) onSocketFailed(connState === "connected"); };
      }

      function onHello() {
        clearTimeout(helloTimer);
        candidates = [activeUrl];
        candidateIdx = 0;
        reconnectDelay = 500;
        stateVersion = 0;
        writeStore("localStorage", URL_KEY, activeUrl);
        setConn("connected");
        startPing();
        var token = readStore("sessionStorage", TOKEN_KEY);
        if (token) resumeSession(token);
      }

      function dropSocket() {
        clearTimeout(helloTimer);
        stopPing();
        if (ws) {
          var old = ws;
          ws = null;
          old.onopen = old.onmessage = old.onclose = old.onerror = null;
          try { old.close(); } catch (e) { }
        }
        failPending("CONNECTION LOST. CHECK YOUR HOLDINGS BEFORE TRYING AGAIN.");
      }

      function onSocketFailed(wasOpen) {
        dropSocket();
        if (!wasOpen && candidates.length > 1) candidateIdx = (candidateIdx + 1) % candidates.length;
        setConn("error");
        var delay = reconnectDelay + Math.floor(Math.random() * 400);
        reconnectDelay = Math.min(reconnectDelay * 2, 8000);
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(openSocket, delay);
      }

      // Keep the connection alive through Cloudflare and notice dead ones quickly.
      function startPing() {
        stopPing();
        pingTimer = setInterval(sendPing, PING_EVERY);
      }

      function sendPing() {
        var sock = ws;
        if (!sock || sock.readyState !== WebSocket.OPEN) return;
        try { sock.send('{"action":"ping"}'); } catch (e) { }
        clearTimeout(pongTimer);
        pongTimer = setTimeout(function () { if (ws === sock) onSocketFailed(true); }, PONG_TIMEOUT);
      }

      function stopPing() {
        clearInterval(pingTimer);
        clearTimeout(pongTimer);
        pingTimer = null;
        pongTimer = null;
      }

      function reconnectNow() {
        if (!candidates.length) return;
        if (ws && ws.readyState === WebSocket.OPEN) { sendPing(); return; }
        if (ws && ws.readyState === WebSocket.CONNECTING) return;
        reconnectDelay = 500;
        openSocket();
      }

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") reconnectNow();
      });
      window.addEventListener("online", reconnectNow);

      // --- REQUESTS (every action waits for the server's answer) ---
      function request(actionName, data, done) {
        if (!isLive()) {
          if (done) done({ ok: false, message: "NOT CONNECTED TO SERVER. RECONNECTING..." });
          return;
        }
        var id = ++reqSeq;
        pending[id] = {
          done: done,
          timer: setTimeout(function () {
            settle(id, { ok: false, message: "NO RESPONSE FROM SERVER. CHECK BEFORE TRYING AGAIN." });
          }, REQUEST_TIMEOUT)
        };
        var payload = {};
        for (var key in data) payload[key] = data[key];
        payload.action = actionName;
        payload.reqId = id;
        try {
          ws.send(JSON.stringify(payload));
        } catch (e) {
          settle(id, { ok: false, message: "NOT CONNECTED TO SERVER. RECONNECTING..." });
        }
      }

      function settle(id, result) {
        var p = pending[id];
        if (!p) return;
        delete pending[id];
        clearTimeout(p.timer);
        if (p.done) p.done(result);
      }

      function failPending(message) {
        Object.keys(pending).forEach(function (id) { settle(id, { ok: false, message: message }); });
      }

      function onServerMessage(raw) {
        clearTimeout(pongTimer);
        var msg;
        try { msg = JSON.parse(raw); } catch (e) { return; }
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "hello") onHello();
        else if (msg.type === "result") settle(msg.reqId, msg);
        else if (msg.type === "auth") onAuth(msg);
        else if (msg.type === "state") onState(msg);
        else if (msg.type === "signed_out") endSession(msg.reason || "SIGNED OUT.");
        else if (msg.type === "error") toast(msg.message || "SERVER ERROR.", false);
      }

      // --- SESSIONS ---
      function onAuth(msg) {
        var newRole = msg.role === "admin" ? "admin" : "team";
        if (role !== newRole) resetViews();
        role = newRole;
        if (msg.token) writeStore("sessionStorage", TOKEN_KEY, msg.token);
        loginMessage("");
        var pw = $("login-password");
        if (pw) pw.value = "";
      }

      function onState(msg) {
        if (!role || !msg.state) return;
        if (typeof msg.version === "number") {
          if (msg.version <= stateVersion) return;
          stateVersion = msg.version;
        }
        var s = msg.state;
        if (role === "team" && lastMarketState !== null && lastMarketState !== s.marketOpen) {
          triggerMarketAnimation(s.marketOpen);
        }
        lastMarketState = s.marketOpen;
        gameState = s;
        render();
      }

      function resetViews() {
        ["screen-admin", "screen-dashboard"].forEach(function (id) {
          var el = $(id);
          if (el) { el.innerHTML = ""; el.__shell = null; }
        });
      }

      function endSession(reason) {
        writeStore("sessionStorage", TOKEN_KEY, null);
        role = null;
        gameState = null;
        lastMarketState = null;
        local = freshLocal();
        resetViews();
        loginMessage(reason || "");
        render();
      }

      function loginMessage(text, neutral) {
        var el = $("login-flash");
        if (!el) return;
        el.textContent = text || "";
        el.style.color = neutral ? "var(--text-muted)" : "var(--loss)";
      }

      function setLoginBusy(busy) {
        loginBusy = busy;
        var btn = $("login-btn");
        if (btn) {
          btn.disabled = busy;
          btn.textContent = busy ? "Verifying..." : "Access Terminal";
        }
      }

      function submitLogin() {
        if (loginBusy) return;
        var u = fieldValue("login-username").trim();
        var p = fieldValue("login-password");
        if (!u || !p) return loginMessage("AUTHENTICATION ERROR: CREDENTIALS REQUIRED.");
        if (!isLive()) return loginMessage("NOT CONNECTED TO THE SERVER YET. PLEASE WAIT A MOMENT.");
        setLoginBusy(true);
        loginMessage("VERIFYING...", true);
        request("login", { username: u, password: p }, function (res) {
          setLoginBusy(false);
          if (!res.ok) loginMessage(res.message || "SIGN-IN FAILED.");
        });
      }

      function resumeSession(token) {
        if (!role) loginMessage("RESTORING SESSION...", true);
        request("resume", { token: token }, function (res) {
          if (res.ok) return;
          if (res.code === "session_invalid") endSession(role ? res.message : "");
          else if (!role) loginMessage("");
        });
      }

      function doLogout() {
        request("logout", {}, null);
        endSession("");
      }

      // --- FEEDBACK ---
      function toast(text, ok) {
        var stack = $("toast-stack");
        if (!stack) return;
        var el = document.createElement("div");
        el.className = "toast " + (ok ? "toast-ok" : "toast-err");
        el.textContent = text;
        stack.appendChild(el);
        while (stack.children.length > 4) stack.removeChild(stack.firstChild);
        setTimeout(function () {
          el.classList.add("toast-out");
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 250);
        }, ok ? 3000 : 5000);
      }

      var tradeFlashTimer = null;
      function tradeFlash(text, ok) {
        var el = $("td-flash");
        if (!el) return toast(text, ok);
        var color = ok ? "#4caf7d" : "#cc2233";

      // --- RENDERING ---

      function patch(el, html) {

        for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === value) return true;

        var snap = { values: {}, focus: null, selStart: null, selEnd: null, scroll: {} };
        var fields = root.querySelectorAll("input[id], select[id], textarea[id]");

        Object.keys(snap.scroll).forEach(function (id) {
          var el = $(id);
          if (el && root.contains(el)) el.scrollTop = snap.scroll[id];

      function adminTeams(body, s) {

          '<div style="display:flex; flex-direction:column; gap:16px;">' +
          '<div style="' + PANEL_STYLE + '">' + panelHead("Registered Teams", "#f0c000", "#f0c000") +

        patch($("at-rows"), s.teams.length ? s.teams.map(function (t) {
          return '<tr style="border-bottom:1px solid rgba(240,192,0,0.04);">' +
            '<td style="padding:14px 20px;"><p style="font-size:13px; font-weight:bold; color:#f5f0e8; margin:0;">' + esc(t.teamName) + '</p></td>' +
            '<td style="padding:14px 20px;"><p style="font-size:12px; color:#555566; margin:0;">' + esc(t.username) + '</p></td>' +

            '<td style="padding:14px 20px; text-align:right;"><span style="font-size:12px; color:#aaaaaa;">$' + fmt(t.portfolio) + '</span></td>' +
            '<td style="padding:14px 20px; text-align:right;"><span style="font-size:13px; font-weight:bold; color:#f5f0e8;">$' + fmt(t.equity) + '</span></td>' +
            '<td style="padding:14px 20px; text-align:right;"><div style="display:flex; justify-content:flex-end; gap:12px;">' +
            '<button data-action="reset-team-password" data-id="' + esc(t.username) + '" class="admin-btn-apply" style="font-family:inherit; white-space:nowrap;">RESET PW</button>' +

            '</div></td>' +
            '</tr>';
        }).join("") : emptyRow(6, "NO TEAMS YET"));
      }

      function adminLeaderboard(body, s) {
        ensureBody(body, "leaderboard",
          '<div style="' + PANEL_STYLE + '">' +
          '<div id="al-head"></div>' +
          '<div class="tbl-scroll"><table style="width:100%; border-collapse:collapse;"><thead><tr style="border-bottom:1px solid rgba(240,192,0,0.06);">' +
          headCells(['Rank', 'Team', 'Cash', 'Portfolio', 'Total Equity', 'Gain / Loss']) +
          '</tr></thead><tbody id="al-rows"></tbody></table></div>' +
          '</div>');

        patch($("al-head"), panelHead("Leaderboard &middot; Round " + s.round, "#f0c000", "#f0c000"));
        var ranked = s.teams.slice().sort(function (a, b) { return b.equity - a.equity; });
        patch($("al-rows"), ranked.length ? ranked.map(function (t, i) {
          var gain = t.equity - s.startingCash;
          return '<tr style="border-bottom:1px solid rgba(240,192,0,0.04); ' + (i === 0 ? 'background:rgba(240,192,0,0.03);' : '') + '">' +
            '<td style="padding:16px 20px; text-align:left;"><span style="font-size:13px; font-weight:900; color:' + (i === 0 ? '#f0c000' : '#555566') + ';">' + String(i + 1).padStart(2, '0') + '</span></td>' +
            '<td style="padding:16px 20px; text-align:left;"><span style="font-size:12px; font-weight:bold; color:' + (i === 0 ? '#f0c000' : '#f5f0e8') + ';">' + esc(t.teamName) + '</span></td>' +
            '<td style="padding:16px 20px; text-align:right;"><span style="font-size:12px; color:#aaaaaa;">$' + fmt(t.cash) + '</span></td>' +
            '<td style="padding:16px 20px; text-align:right;"><span style="font-size:12px; color:#aaaaaa;">$' + fmt(t.portfolio) + '</span></td>' +
            '<td style="padding:16px 20px; text-align:right;"><span style="font-size:13px; font-weight:bold; color:#f5f0e8;">$' + fmt(t.equity) + '</span></td>' +
            '<td style="padding:16px 20px; text-align:right;"><span style="font-size:12px; font-weight:600; color:' + (gain >= 0 ? '#4caf7d' : '#cc2233') + ';">' + gainText(gain) + '</span></td>' +
            '</tr>';
        }).join("") : emptyRow(6, "NO TEAMS YET"));
      }

      function adminSettings(body, s) {
        ensureBody(body, "settings",
          '<div class="resp-stack" style="display:flex; gap:20px; align-items:flex-start;">' +

          // Change Password Form
          '<div class="resp-full" style="flex:1; ' + PANEL_STYLE + '">' + panelHead("Change Admin Password", "#1a3a8f", "#7aaaff") +
          '<div style="padding:20px; display:flex; flex-direction:column; gap:12px;">' +
          '<div><label style="' + LABEL_STYLE + '" for="pw-current">Current Password</label>' + passwordField("pw-current", 'maxlength="128" autocomplete="current-password" data-enter="change-admin-password"') + '</div>' +
          '<div><label style="' + LABEL_STYLE + '" for="pw-new">New Password</label>' + passwordField("pw-new", 'maxlength="128" autocomplete="new-password" data-enter="change-admin-password"') + '</div>' +
          '<div><label style="' + LABEL_STYLE + '" for="pw-confirm">Confirm New Password</label>' + passwordField("pw-confirm", 'maxlength="128" autocomplete="new-password" data-enter="change-admin-password"') + '</div>' +
          '<button data-action="change-admin-password" class="admin-btn-gold" style="margin-top:4px; width:100%; font-family:inherit;">UPDATE PASSWORD</button>' +
          '</div>' +
          '</div>' +

          // Adjust Team Cash Form
          '<div class="resp-full" style="flex:1; ' + PANEL_STYLE + '">' + panelHead("Adjust Team Cash", "#4caf7d", "#4caf7d") +
          '<div style="padding:20px; display:flex; flex-direction:column; gap:12px;">' +
          '<div><label style="' + LABEL_STYLE + '" for="adjust-cash-team">Select Team</label><select id="adjust-cash-team" style="width:100%; box-sizing:border-box; ' + INPUT_STYLE + ' cursor:pointer;"></select></div>' +
          '<div><label style="' + LABEL_STYLE + '" for="adjust-cash-amount">Amount</label><input id="adjust-cash-amount" type="number" min="1" step="0.01" placeholder="Amount (e.g. 5000)" style="width:100%; box-sizing:border-box; ' + INPUT_STYLE + '" /></div>' +
          '<p id="adjust-cash-info" style="font-size:10px; color:#555566; margin:0;"></p>' +
          '<div style="display:flex; gap:12px; margin-top:4px;">' +
          '<button data-action="add-cash" class="admin-btn-addcash" style="flex:1; font-family:inherit;">ADD CASH</button>' +
          '<button data-action="remove-cash" class="admin-btn-subcash" style="flex:1; font-family:inherit;">DEDUCT CASH</button>' +
          '</div>' +
          '</div>' +
          '</div>' +
          '</div>');

        patchSelect($("adjust-cash-team"), s.teams.length ? s.teams.map(function (t) {
          return '<option value="' + esc(t.username) + '" style="background:#0e0e0e; color:#f5f0e8;">' + esc(t.teamName) + ' &middot; @' + esc(t.username) + '</option>';
        }).join("") : '<option value="" style="background:#0e0e0e; color:#f5f0e8;">No teams yet</option>');
        updateCashInfo();
      }

      function updateCashInfo() {
        var info = $("adjust-cash-info");
        if (!info) return;
        var team = findTeam(fieldValue("adjust-cash-team"));
        info.textContent = team ? "Current cash: $" + fmt(team.cash) + " · Equity: $" + fmt(team.equity) : "";
      }

      // --- ADMIN ACTIONS ---
      function runAdmin(btn, actionName, data, onOk) {
        if (btn) btn.disabled = true;
        request(actionName, data, function (res) {
          if (btn) btn.disabled = false;
          toast(res.message || (res.ok ? "DONE." : "REQUEST FAILED."), res.ok);
          if (res.ok && onOk) onOk(res);
        });
      }

      function toggleMarket(btn) {
        runAdmin(btn, "set-market", { open: !gameState.marketOpen });
      }

      function nextRound(btn) {
        runAdmin(btn, "next-round", { expectedRound: gameState.round });
      }

      function resetGame(btn) {
        if (!window.confirm("Reset all teams to $" + fmt(gameState.startingCash) + " and clear all holdings?")) return;
        runAdmin(btn, "reset-game", {});
      }

      function applyPrice(btn, id) {
        var raw = fieldValue("price-edit-" + id).trim();
        var modifier = Number(raw);
        if (!raw || !isFinite(modifier) || modifier === 0) return toast("ENTER A PRICE CHANGE, E.G. 20 OR -20.", false);
        runAdmin(btn, "apply-price", { id: id, modifier: modifier }, function () { clearFields(["price-edit-" + id]); });
      }

      function deleteCompany(btn, id) {
        var company = findCompany(id);
        if (!window.confirm("Delete " + (company ? company.name : "this company") + "? This will also wipe any shares teams own of it.")) return;
        runAdmin(btn, "delete-company", { id: id });
      }

      function addCompany(btn) {
        var name = fieldValue("new-company-name").trim();
        var industry = fieldValue("new-company-industry").trim();
        var price = Number(fieldValue("new-company-price"));
        if (!name) return toast("ENTER A COMPANY NAME.", false);
        if (!isFinite(price) || price < 1) return toast("ENTER AN INITIAL PRICE OF AT LEAST $1.", false);
        runAdmin(btn, "add-company", { name: name, industry: industry || "General", price: price }, function () {
          clearFields(["new-company-name", "new-company-industry", "new-company-price"]);
        });
      }

      function addTeam(btn) {
        var teamName = fieldValue("new-team-name").trim();
        var username = fieldValue("new-team-username").trim();
        var password = fieldValue("new-team-password");
        if (!teamName || !username || !password) return toast("FILL IN TEAM NAME, USERNAME AND PASSWORD.", false);
        // Inputs are only cleared once the server confirms the team was created.
        runAdmin(btn, "add-team", { teamName: teamName, username: username, password: password }, function () {
          clearFields(["new-team-name", "new-team-username", "new-team-password"]);
        });
      }

      function deleteTeam(btn, username) {
        var team = findTeam(username);
        if (!window.confirm("Permanently remove " + (team ? team.teamName : "this team") + " and their holdings?")) return;
        runAdmin(btn, "delete-team", { username: username });
      }

      function resetTeamPassword(btn, username) {
        var team = findTeam(username);
        var password = window.prompt("New password for " + (team ? team.teamName : username) + " (at least 4 characters):");
        if (password == null) return;
        if (password.length < 4) return toast("PASSWORD MUST BE AT LEAST 4 CHARACTERS.", false);
        runAdmin(btn, "reset-team-password", { username: username, password: password });
      }

      function changeAdminPassword(btn) {
        var current = fieldValue("pw-current");
        var next = fieldValue("pw-new");
        var confirmed = fieldValue("pw-confirm");
        if (!current || !next || !confirmed) return toast("FILL ALL PASSWORD FIELDS.", false);
        if (next !== confirmed) return toast("NEW PASSWORDS DO NOT MATCH.", false);
        if (next.length < 8) return toast("NEW PASSWORD MUST BE AT LEAST 8 CHARACTERS.", false);
        runAdmin(btn, "change-password", { current: current, next: next }, function () {
          clearFields(["pw-current", "pw-new", "pw-confirm"]);
        });
      }

      function adjustCash(btn, isAdding) {
        var username = fieldValue("adjust-cash-team");
        var raw = fieldValue("adjust-cash-amount");
        var amount = Number(raw);
        if (!username) return toast("SELECT A TEAM.", false);
        if (!raw || !isFinite(amount) || amount <= 0) return toast("ENTER A VALID POSITIVE AMOUNT.", false);
        runAdmin(btn, "adjust-cash", { username: username, amount: isAdding ? amount : -amount }, function () {
          clearFields(["adjust-cash-amount"]);
        });
      }

      // --- TEAM DASHBOARD ---
      var TEAM_TABS = [["dashboard", "DASHBOARD"], ["leaderboard", "LEADERBOARD"]];

      function buildTeamUI(container) {
        var s = gameState;
        ensureShell(container, "tp");
        patch($("tp-header"), headerHTML(s.me.teamName, s));
        renderTicker($("tp-ticker"), s.companies);
        patch($("tp-tabs"), tabsHTML(TEAM_TABS, local.teamTab, "set-team-tab"));
        var body = $("tp-body");
        if (local.teamTab === "leaderboard") teamLeaderboard(body, s);
        else teamDashboard(body, s);
      }

      function selectedCompany(s) {
        var company = s.companies.find(function (c) { return c.id === local.selectedCompanyId; }) || s.companies[0] || null;
        local.selectedCompanyId = company ? company.id : null;
        return company;
      }

      function tpCard(label, valueHTML, color) {
        return '<div class="tp-card"><div class="tp-label">' + label + '</div><div class="tp-val"' + (color ? ' style="color:' + color + ';"' : '') + '>' + valueHTML + '</div></div>';
      }

      var DASHBOARD_SKELETON =
        '<div class="td-wrap" style="padding:32px; max-width:1600px; margin:0 auto; width:100%; box-sizing:border-box;">' +
        '<div id="td-stats" class="resp-wrap" style="display:flex; gap:16px; margin-bottom:24px;"></div>' +
        '<div class="tp-table-wrap">' +
        '<div class="tp-table-head"><div style="width:4px; height:16px; background:#f0c000;"></div><span style="font-size:10px; color:#f0c000; letter-spacing:0.3em; text-transform:uppercase; font-weight:600;">MARKET WATCH</span></div>' +
        '<div class="tbl-scroll"><table class="tp-table"><thead><tr><th>COMPANY</th><th>PRICE</th><th>CHANGE</th><th>OWNED</th></tr></thead><tbody id="td-market"></tbody></table></div>' +
        '</div>' +
        '<div class="resp-stack" style="display:flex; gap:16px;">' +
        '<div class="resp-full" style="width:380px; flex-shrink:0; ' + PANEL_STYLE + '">' +
        '<div class="tp-table-head" style="border-bottom:1px solid rgba(240,192,0,0.08);"><div style="width:4px; height:16px; background:#1a3a8f;"></div><span style="font-size:10px; color:#7aaaff; letter-spacing:0.3em; text-transform:uppercase; font-weight:600;">TRADE</span></div>' +
        '<div style="padding:20px; display:flex; flex-direction:column; gap:16px;">' +
        '<div>' +
        '<label class="tp-label" style="display:block;" for="trade-select">SELECT STOCK</label>' +
        '<select id="trade-select" style="width:100%; background:#080808; border:1px solid rgba(240,192,0,0.12); color:#f5f0e8; font-size:12px; padding:12px; outline:none; font-family:inherit; cursor:pointer;"></select>' +
        '</div>' +
        '<p id="td-owned" style="font-size:10px; color:#555566; margin:0;"></p>' +
        '<div>' +
        '<label class="tp-label" style="display:block;" for="trade-qty">QUANTITY</label>' +
        '<input id="trade-qty" type="number" inputmode="numeric" min="1" step="1" placeholder="0" style="width:100%; background:#080808; border:1px solid rgba(240,192,0,0.12); color:#f5f0e8; font-size:13px; padding:12px; outline:none; font-family:inherit; box-sizing:border-box;" />' +
        '</div>' +
        '<p id="td-cost" style="font-size:10px; color:#555566; margin:0; min-height:12px;"></p>' +
        '<div style="display:flex; gap:12px; margin-top:8px;">' +
        '<button id="btn-buy" data-action="buy" class="tp-btn tp-btn-buy">BUY</button>' +
        '<button id="btn-sell" data-action="sell" class="tp-btn tp-btn-sell">SELL</button>' +
        '</div>' +
        '<div id="td-flash"></div>' +
        '</div>' +
        '</div>' +
        '<div id="td-holdings" style="flex:1; ' + PANEL_STYLE + ' display:flex; flex-direction:column; max-height:380px;"></div>' +
        '</div>' +
        '</div>';

      function teamDashboard(body, s) {
        ensureBody(body, "dashboard", DASHBOARD_SKELETON);
        var me = s.me;
        var company = selectedCompany(s);
        var gain = me.equity - s.startingCash;

        patch($("td-stats"),
          tpCard("CASH", "$" + fmt(me.cash)) +
          tpCard("PORTFOLIO (STOCKS)", "$" + fmt(me.portfolio)) +
          tpCard("TOTAL EQUITY", "$" + fmt(me.equity)) +
          tpCard("GAIN / LOSS", gainText(gain), gain >= 0 ? "#4caf7d" : "#cc2233"));

        patch($("td-market"), s.companies.length ? s.companies.map(function (c) {
          var pct = pctChange(c);
          var up = pct >= 0;
          var color = up ? "#4caf7d" : "#cc2233";
          var ownedQty = me.holdings[c.id] || 0;
          var isSelected = company && c.id === company.id;
          return '<tr style="cursor:pointer; background:' + (isSelected ? 'rgba(240,192,0,0.06)' : 'transparent') + ';" data-action="select-company-row" data-id="' + esc(c.id) + '">' +
            '<td><p style="font-size:13px; font-weight:bold; color:#f5f0e8; margin:0;">' + esc(c.name) + '</p><p style="font-size:10px; color:#555566; margin:2px 0 0 0;">' + esc(c.industry) + '</p></td>' +
            '<td><span style="font-size:13px; font-weight:600; color:#f0c000;">$' + fmt(c.price) + '</span></td>' +
            '<td><span style="font-size:12px; font-weight:600; color:' + color + ';">' + (up ? '&#8599; +' : '&#8600; ') + pct.toFixed(1) + '%</span></td>' +
            '<td><span style="font-size:13px; color:#f5f0e8;">' + (ownedQty > 0 ? fmt(ownedQty) : '<span style="color:#333344">&mdash;</span>') + '</span></td>' +
            '</tr>';
        }).join("") : '<tr><td colspan="4" style="text-align:center; color:#333344; font-size:11px; letter-spacing:0.2em; padding:32px;">NO COMPANIES LISTED</td></tr>');

        var select = $("trade-select");
        patchSelect(select, s.companies.map(function (c) {
          return '<option value="' + esc(c.id) + '" style="background:#0e0e0e; color:#f5f0e8;">' + esc(c.name) + ' &mdash; $' + fmt(c.price) + '</option>';
        }).join(""));
        if (select && company) select.value = company.id;

        var owned = company ? (me.holdings[company.id] || 0) : 0;
        patch($("td-owned"), owned > 0 ? 'You own ' + fmt(owned) + ' shares &middot; worth $' + fmt(owned * company.price) : 'You don\'t own any shares of this stock');

        var holdingsRows = s.companies.filter(function (c) { return (me.holdings[c.id] || 0) > 0; }).map(function (c) {
          var qty = me.holdings[c.id];
          return '<div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid rgba(240,192,0,0.04);">' +
            '<div><p style="font-size:13px; font-weight:bold; color:#f5f0e8; margin:0;">' + esc(c.name) + '</p><p style="font-size:10px; color:#555566; margin:4px 0 0 0;">' + fmt(qty) + ' shares</p></div>' +
            '<div style="text-align:right;"><p style="font-size:14px; font-weight:900; color:#f0c000; margin:0;">$' + fmt(qty * c.price) + '</p><p style="font-size:10px; color:#555566; margin:4px 0 0 0;">@ $' + fmt(c.price) + '</p></div>' +
            '</div>';
        }).join("") || '<div style="padding:48px 20px; text-align:center; color:#333344; font-size:11px; letter-spacing:0.2em;">NO SHARES HELD</div>';

        patch($("td-holdings"),
          '<div class="tp-table-head" style="border-bottom:1px solid rgba(240,192,0,0.08);"><div style="width:4px; height:16px; background:#4caf7d;"></div><span style="font-size:10px; color:#4caf7d; letter-spacing:0.3em; text-transform:uppercase; font-weight:600;">YOUR HOLDINGS</span></div>' +
          '<div id="td-holdings-list" data-keep-scroll style="flex:1; overflow-y:auto;">' + holdingsRows + '</div>' +
          '<div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; background:rgba(240,192,0,0.03); border-top:1px solid rgba(240,192,0,0.08);">' +
          '<span style="font-size:10px; color:#555566; letter-spacing:0.3em; text-transform:uppercase;">TOTAL PORTFOLIO</span>' +
          '<span style="font-size:14px; font-weight:900; color:#f0c000;">$' + fmt(me.portfolio) + '</span>' +
          '</div>');

        updateTradeHint();
      }

      function updateTradeHint() {
        var hint = $("td-cost");
        var s = gameState;
        if (!hint || !s || !s.me) return;
        var company = selectedCompany(s);
        var raw = fieldValue("trade-qty").trim();
        if (!s.marketOpen) {
          hint.textContent = "MARKET CLOSED · TRADING IS PAUSED";
          hint.style.color = "#cc2233";
        } else if (company && /^\d+$/.test(raw) && Number(raw) > 0) {
          hint.textContent = "VALUE $" + fmt(Number(raw) * company.price) + " · YOUR CASH $" + fmt(s.me.cash);
          hint.style.color = "#555566";
        } else {
          hint.textContent = "";
        }
        var disabled = local.tradeBusy || !s.marketOpen || connState !== "connected" || !company;
        ["btn-buy", "btn-sell"].forEach(function (id) { var b = $(id); if (b) b.disabled = disabled; });
      }

      function trade(side) {
        var s = gameState;
        if (local.tradeBusy || !s || !s.me) return;
        var company = selectedCompany(s);
        if (!company) return tradeFlash("PLEASE SELECT A STOCK.", false);
        var raw = fieldValue("trade-qty").trim();
        if (!/^\d+$/.test(raw) || Number(raw) <= 0) return tradeFlash("ENTER A WHOLE NUMBER OF SHARES.", false);
        if (!s.marketOpen) return tradeFlash("MARKET IS CURRENTLY CLOSED.", false);

        // Nothing changes on screen until the server confirms; the buttons stay
        // locked meanwhile so one click can never turn into several trades.
        local.tradeBusy = true;
        updateTradeHint();
        request(side, { companyId: company.id, quantity: Number(raw), expectedPrice: company.price }, function (res) {
          local.tradeBusy = false;
          if (res.ok) clearFields(["trade-qty"]);
          updateTradeHint();
          tradeFlash(res.message || (res.ok ? "DONE." : "TRADE FAILED."), res.ok);
        });
      }

      function teamLeaderboard(body, s) {
        ensureBody(body, "leaderboard",
          '<div class="td-wrap" style="padding:32px; max-width:1600px; margin:0 auto; width:100%; box-sizing:border-box;"><div class="tp-table-wrap">' +
          '<div id="tl-head" class="tp-table-head"></div>' +
          '<div class="tbl-scroll"><table class="tp-table"><thead><tr><th style="text-align:left;">RANK</th><th style="text-align:left;">TEAM</th><th>CASH</th><th>PORTFOLIO</th><th>TOTAL EQUITY</th><th>GAIN / LOSS</th></tr></thead><tbody id="tl-rows"></tbody></table></div>' +
          '</div></div>');

        patch($("tl-head"), '<div style="width:4px; height:16px; background:#f0c000;"></div><span style="font-size:10px; color:#f0c000; letter-spacing:0.3em; text-transform:uppercase; font-weight:600;">LEADERBOARD &middot; ROUND ' + s.round + '</span>');
        patch($("tl-rows"), s.leaderboard.map(function (t, i) {
          var gain = t.equity - s.startingCash;
          var color = gain >= 0 ? "#4caf7d" : "#cc2233";
          return '<tr style="' + (t.me ? 'background:rgba(240,192,0,0.06);' : '') + '">' +
            '<td style="text-align:left;"><span style="font-size:14px; font-weight:900; color:' + (i === 0 ? '#f0c000' : '#555566') + ';">' + String(i + 1).padStart(2, '0') + '</span></td>' +
            '<td style="text-align:left;"><div style="display:flex; align-items:center; gap:8px;">' +
            (t.me ? '<div style="width:2px; height:20px; background:#f0c000;"></div>' : '') +
            '<span style="font-size:13px; font-weight:bold; color:' + (t.me ? '#f0c000' : '#f5f0e8') + ';">' + esc(t.teamName) + '</span>' +
            (t.me ? '<span style="font-size:9px; color:#f0c000; border:1px solid rgba(240,192,0,0.3); padding:2px 6px; letter-spacing:0.1em;">YOU</span>' : '') +
            '</div></td>' +
            '<td><span style="font-size:13px; color:#aaaaaa;">$' + fmt(t.cash) + '</span></td>' +
            '<td><span style="font-size:13px; color:#aaaaaa;">$' + fmt(t.portfolio) + '</span></td>' +
            '<td><span style="font-size:14px; font-weight:bold; color:#f5f0e8;">$' + fmt(t.equity) + '</span></td>' +
            '<td><span style="font-size:13px; font-weight:600; color:' + color + ';">' + gainText(gain) + '</span></td>' +
            '</tr>';
        }).join(""));
      }

      // --- EASTER EGG ---
      function showEasterEgg() {
        if ($("ee-container")) return;

        var ee = document.createElement("div");
        ee.id = "ee-container";
        ee.className = "ee-overlay";
        ee.innerHTML = '<div class="ee-modal">' +
          '<div class="ee-inner">' +
          '<div class="ee-title"><div class="ee-line"></div>SYSTEM ARCHITECTS<div class="ee-line"></div></div>' +
          '<div class="ee-name">Ch Muhammad Umer Shahid</div>' +
          '<div class="ee-role">Maker & Developer of Website<br><span class="ee-subtext">(The brains behind the build and website)</span></div>' +
          '<div class="ee-name" style="margin-top: 12px;">Ayesha Irfan</div>' +
          '<div class="ee-role">Visionary & Strategist<br><span class="ee-subtext">(The brains behind the core idea)</span></div>' +
          '<button id="ee-close-btn" class="ee-btn">RESPECT</button>' +
          '</div>' +
          '</div>';
        document.body.appendChild(ee);

        $("ee-close-btn").addEventListener("click", function () {
          ee.style.animation = "none";
          ee.style.opacity = "0";
          ee.style.transition = "opacity 0.2s ease";
          setTimeout(function () { ee.remove(); }, 200);
        });
      }

      // --- UI EVENT ROUTER ---
      function connectClicked() {
        var raw = fieldValue("ws-url").trim();
        var url;
        try {
          url = raw ? normalizeSocketUrl(raw) : defaultSocketUrl();
        } catch (e) {
          return toast("INVALID ADDRESS.", false);
        }
        startConnecting([url]);
      }

      var CLICK_ACTIONS = {
        "connect": function () { connectClicked(); },
        "logout": function () { doLogout(); },
        "easter-egg": function () { showEasterEgg(); },
        "toggle-password": function (btn) { togglePassword(btn); },

        // Team
        "set-team-tab": function (btn) { local.teamTab = btn.getAttribute("data-tab"); render(); },
        "select-company-row": function (row, id) { local.selectedCompanyId = id; render(); },
        "buy": function () { trade("buy"); },
        "sell": function () { trade("sell"); },

        // Admin
        "set-admin-tab": function (btn) { local.adminTab = btn.getAttribute("data-tab"); render(); },
        "toggle-market": toggleMarket,
        "next-round": nextRound,
        "reset-game": resetGame,
        "apply-price": applyPrice,
        "delete-company": deleteCompany,
        "add-company": addCompany,
        "delete-team": deleteTeam,
        "reset-team-password": resetTeamPassword,
        "add-team": addTeam,
        "change-admin-password": changeAdminPassword,
        "add-cash": function (btn) { adjustCash(btn, true); },
        "remove-cash": function (btn) { adjustCash(btn, false); }
      };

      document.addEventListener("click", function (e) {
        var el = e.target.closest ? e.target.closest("[data-action]") : null;
        if (!el) return;
        var handler = CLICK_ACTIONS[el.getAttribute("data-action")];
        if (!handler) return;
        e.preventDefault();
        handler(el, el.getAttribute("data-id"));
      });

      $("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        submitLogin();
      });

      document.addEventListener("input", function (e) {
        if (e.target && e.target.id === "trade-qty") updateTradeHint();
      });

      document.addEventListener("change", function (e) {
        if (!e.target) return;
        if (e.target.id === "trade-select") { local.selectedCompanyId = e.target.value; render(); }
        else if (e.target.id === "adjust-cash-team") updateCashInfo();
      });

      var secretInput = "";
      document.addEventListener("keydown", function (e) {
        var target = e.target;
        // Enter inside a form field presses that form's main button.
        if (e.key === "Enter" && target && target.getAttribute && target.getAttribute("data-enter")) {
          e.preventDefault();
          var selector = '[data-action="' + target.getAttribute("data-enter") + '"]';
          if (target.getAttribute("data-id")) selector += '[data-id="' + CSS.escape(target.getAttribute("data-id")) + '"]';
          var btn = document.querySelector("button" + selector);
          if (btn && !btn.disabled) btn.click();
          return;
        }
        if (target && (target.tagName === "INPUT" || target.tagName === "SELECT" || target.tagName === "TEXTAREA" || target.isContentEditable)) return;
        if (!e.key || e.key.length !== 1) return;

        secretInput = (secretInput + e.key.toLowerCase()).slice(-10);
        if (secretInput.indexOf("um") >= 0 || secretInput.indexOf("ay") >= 0) {
          secretInput = "";
          showEasterEgg();
        }
      });

      // --- START ---
      var urlBox = $("ws-url");
      if (urlBox) urlBox.placeholder = defaultSocketUrl();
      setConn("offline");
      startConnecting(startupCandidates());
    })();
  </script>
</body>

</html>
